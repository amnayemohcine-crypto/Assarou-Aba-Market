name: Build Assarou Aba Market Pro

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/assarou/abamarket
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AssarouAbaMarket"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.assarou.abamarket'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.assarou.abamarket'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#111827</item>
                  <item name="android:navigationBarColor">#111827</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Assarou Aba Market"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/assarou/abamarket/MainActivity.java <<'EOF'
          package com.assarou.abamarket;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);

                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Assarou Aba Market</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#172033}
          header{background:#111827;color:white;padding:20px;border-radius:0 0 25px 25px}
          header h1{margin:0;font-size:24px}
          header p{margin:6px 0 0;color:#b9c2d0}
          .wrap{padding:15px;max-width:700px;margin:auto}
          .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
          .card{background:white;border-radius:18px;padding:18px;box-shadow:0 3px 12px #0001}
          .card b{display:block;font-size:24px;margin-top:8px}
          .nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}
          button{border:0;border-radius:13px;padding:13px;background:#2563eb;color:white;font-weight:bold}
          button.dark{background:#111827}
          button.green{background:#16a34a}
          button.red{background:#dc2626}
          .panel{background:white;border-radius:18px;padding:16px;margin-top:15px}
          input,select{width:100%;padding:13px;margin:7px 0;border:1px solid #d7dce5;border-radius:12px;font
                    .row{display:flex;gap:8px}
          .row>*{flex:1}
          .item{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
          .title{font-size:18px;font-weight:bold;margin-bottom:10px}
          .hide{display:none}
          .badge{background:#e8f0ff;color:#2563eb;padding:5px 9px;border-radius:10px}
          </style>
          </head>

          <body>
          <header>
            <h1>Assarou Aba Market</h1>
            <p>نظام تسيير المحل التجاري</p>
          </header>

          <main class="wrap">

            <div class="cards">
              <div class="card">📦 المنتجات<b id="productsCount">0</b></div>
              <div class="card">👥 الزبناء<b id="customersCount">0</b></div>
              <div class="card">💰 المبيعات<b id="salesTotal">0 DH</b></div>
              <div class="card">💳 الديون<b id="debtsTotal">0 DH</b></div>
            </div>

            <div class="nav">
              <button onclick="show('products')">📦 المنتجات</button>
              <button onclick="show('customers')">👥 الزبناء</button>
              <button onclick="show('sales')">🧾 المبيعات</button>
            </div>

            <section id="products" class="panel">
              <div class="title">📦 إدارة المنتجات</div>
              <input id="pname" placeholder="اسم المنتج">
              <div class="row">
                <input id="pprice" type="number" placeholder="الثمن">
                <input id="pstock" type="number" placeholder="المخزون">
              </div>
              <button class="green" onclick="addProduct()">إضافة المنتج</button>
              <div id="productsList"></div>
            </section>

            <section id="customers" class="panel hide">
              <div class="
                        <div class="title">👥 إدارة الزبناء</div>
          <input id="cname" placeholder="اسم الزبون">
          <input id="cphone" placeholder="رقم الهاتف">
          <button class="green" onclick="addCustomer()">إضافة الزبون</button>
          <div id="customersList"></div>
        </section>

        <section id="sales" class="panel hide">
          <div class="title">🧾 بيع سريع</div>
          <select id="saleProduct"></select>
          <input id="saleQty" type="number" value="1" min="1">
          <button onclick="makeSale()">تسجيل البيع</button>
          <div id="salesList"></div>
        </section>

      </main>

      <script>
      const KEY='assarou_market_v1';

      let db=JSON.parse(
        localStorage.getItem(KEY) ||
        '{"products":[],"customers":[],"sales":[]}'
      );

      function save(){
        localStorage.setItem(KEY,JSON.stringify(db));
        render();
      }

      function addProduct(){
        let n=document.getElementById('pname').value.trim();
        let p=Number(document.getElementById('pprice').value);
        let s=Number(document.getElementById('pstock').value);

        if(!n||p<0||s<0){
          alert('دخل معلومات صحيحة');
          return;
        }

        db.products.push({
          id:Date.now(),
          name:n,
          price:p,
          stock:s
        });

        document.getElementById('pname').value='';
        document.getElementById('pprice').value='';
        document.getElementById('pstock').value='';

        save();
      }

      function addCustomer(){
        let n=document.getElementById('cname').value.trim();
        let ph=document.getElementById('cphone').value.trim();

        if(!n){
          alert('دخل اسم الزبون');
          return;
        }

        db.customers.push({
          id:Date.now(),
          name:n,
          phone:ph,
          debt:0
        });

        document.getElementById('cname').value='';
        document.getElementById('cphone').value='';

        save();
      }

      function makeSale(){
        let pid=Number(document.getElementById('saleProduct').value);
        let qty=Number(document.getElementById('saleQty').value);

        let p=db.products.find(x=>x.id===pid);

        if(!p||qty<1)return;

        if(p.stock<qty){
          alert('المخزون غير كافي');
          return;
        }

        let total=p.price*qty;

        p.stock-=qty;

        db.sales.push({
          id:Date.now(),
          product:p.name,
          qty:qty,
          total:total,
          date:new Date().toLocaleString()
        });

        save();

        alert('تم تسجيل البيع: '+total+' DH');
      }

      function show(id){
        ['products','customers','sales'].forEach(x=>{
          document
            .getElementById(x)
            .classList
            .toggle('hide',x!==id);
        });
      }

      function render(){

        document.getElementById('productsCount').textContent=
          db.products.length;

        document.getElementById('customersCount').textContent=
          db.customers.length;

        let total=db.sales.reduce(
          (a,x)=>a+x.total,0
        );

        document.getElementById('salesTotal').textContent=
          total.toFixed(2)+' DH';

        let debts=db.customers.reduce(
          (a,x)=>a+(x.debt||0),0
        );

        document.getElementById('debtsTotal').textContent=
          debts.toFixed(2)+' DH';

        document.getElementById('productsList').innerHTML=
          db.products.map(p=>
            '<div class="item"><span>'+
            p.name+
            '<br><small>'+p.price+' DH</small>'+
            '</span><span class="badge">'+
            p.stock+
            '</span></div>'
          ).join('');

        document.getElementById('customersList').innerHTML=
          db.customers.map(c=>
            '<div class="item"><span>'+
            c.name+
            '<br><small>'+c.phone+'</small>'+
            '</span><span class="badge">'+
            (c.debt||0)+
            ' DH</span></div>'
          ).join('');

        document.getElementById('saleProduct').innerHTML=
          db.products.map(p=>
            '<option value="'+p.id+'">'+
            p.name+
            ' — '+
            p.price+
            ' DH</option>'
          ).join('');

        document.getElementById('salesList').innerHTML=
          db.sales.slice().reverse().map(s=>
            '<div class="item"><span>'+
            s.product+
            ' × '+
            s.qty+
            '<br><small>'+
            s.date+
            '</small></span><b>'+
            s.total+
            ' DH</b></div>'
          ).join('');
      }

      render();
      </script>

      </body>
      </html>
      EOF

- name: Setup Java
  uses: actions/setup-java@v4
  with:
    distribution: temurin
    java-version: '17'

- name: Setup Gradle
  uses: gradle/actions/setup-gradle@v4
  with:
    gradle-version: '8.7'

- name: Build APK
  run: gradle assembleDebug --no-daemon

- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: Assarou-Aba-Market-Pro-APK
    path: app/build/outputs/apk/debug/app-debug.apk
